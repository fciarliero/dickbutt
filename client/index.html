<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Culo Caca</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍆</text></svg>">
<style>
  :root { --bg: #14101a; --panel: rgba(20, 14, 28, .82); --fg: #f4ecf7; --muted: #a998b3; --accent: #ff6b9a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.35 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .panel { position: fixed; background: var(--panel); border-radius: 10px; padding: 10px 12px; pointer-events: none; }
  #net { top: 16px; left: 16px; padding: 6px 10px; font-size: 12px; color: var(--muted); display: none; }
  #net b { font-variant-numeric: tabular-nums; }
  #banner { top: 16px; left: 50%; transform: translateX(-50%); font-size: 22px; font-weight: 700; text-align: center; display: none; }
  #banner small { display: block; font-size: 14px; font-weight: 400; color: var(--muted); }
  #players { top: 16px; right: 16px; min-width: 190px; max-width: 280px; pointer-events: auto; }
  .bots { display: flex; align-items: center; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,.12); color: var(--muted); font-size: 13px; }
  .bots button { font: inherit; width: 28px; height: 26px; border-radius: 6px; border: 1px solid #4a3a55; background: #2a1f33; color: var(--fg); cursor: pointer; }
  .bots button:hover { background: #3a2c4a; }
  .bots span { flex: 1; }
  #players h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .chain { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 4px 0; border-top: 1px solid rgba(255,255,255,.07); }
  .chain:first-of-type { border-top: 0; }
  .who { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .who.off { opacity: .4; text-decoration: line-through; }
  .who.me { font-weight: 700; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .arrow { color: var(--muted); font-size: 11px; }
  #feed { bottom: 16px; left: 16px; max-width: 420px; background: none; padding: 0; }
  #feed div { background: var(--panel); border-radius: 8px; padding: 5px 10px; margin-top: 6px; transition: opacity 1s; }
  #help { bottom: 16px; left: 50%; transform: translateX(-50%); font-size: 13px; color: var(--muted); white-space: nowrap; }
  #help b { color: var(--fg); }
  #boost { bottom: 62px; left: 50%; transform: translateX(-50%); width: 200px; padding: 6px 10px; display: none; font-size: 12px; font-weight: 700; letter-spacing: .08em; }
  #boost .row { display: flex; justify-content: space-between; color: var(--muted); }
  #boost .track { height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); margin-top: 4px; overflow: hidden; }
  #boost .fill { height: 100%; width: 100%; border-radius: 3px; background: var(--accent); }
  #boost.ready .row { color: var(--fg); }
  #join { position: fixed; inset: 0; display: grid; place-items: center; overflow-y: auto; padding: 16px 0; background: radial-gradient(circle at 50% 40%, #2a1835, var(--bg)); }
  #join form { background: var(--panel); padding: 28px; border-radius: 14px; width: min(360px, calc(100vw - 32px)); text-align: center; }
  #join h1 { margin: 0 0 4px; font-size: 32px; }
  #join p { color: var(--muted); margin: 0 0 18px; }
  #name, #go { width: 100%; font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid #4a3a55; }
  #name { background: #1c1424; color: var(--fg); margin-bottom: 10px; }
  #go { background: var(--accent); color: #1a0d14; font-weight: 700; border: 0; cursor: pointer; }
  #join .err { color: #ff8a8a; min-height: 1.3em; margin: 10px 0 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="banner" class="panel"></div>
<div id="net" class="panel">ping <b id="ping">–</b></div>
<div id="players" class="panel"><h3>Cadenas</h3><div id="chains"></div>
  <div class="bots"><span>🤖 Bots: <b id="botCount">0</b></span>
    <button id="botMinus" title="Sacar un bot">−</button><button id="botPlus" title="Agregar un bot">+</button></div>
</div>
<div id="feed" class="panel"></div>
<div id="boost" class="panel"><div class="row"><span>BOOST</span><span id="boostText">LISTO</span></div><div class="track"><div class="fill" id="boostFill"></div></div></div>
<div id="help" class="panel"><b>← →</b> girar · <b>↑</b> empujar · <b>espacio</b> boost · entrá por detrás y alineado · conquistado: tus teclas <b>sabotean</b></div>
<div id="join">
  <form id="joinForm">
    <h1>🍆 Culo Caca</h1>
    <p>Metete entre las bolas de los demás y quedate con todo.</p>
    <input id="name" maxlength="16" placeholder="Tu nombre" autocomplete="off" autofocus>
    <button id="go">Entrar</button>
    <p class="err" id="err"></p>
  </form>
</div>
<script src="/static/game.js"></script>
</body>
</html>
